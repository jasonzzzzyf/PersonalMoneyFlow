<!-- bottom-nav.component.html -->

<nav class="bottom-nav">

  <!-- Details (明细) -->
  <button class="nav-item"
          [class.active]="isActive('details')"
          (click)="navigateTo('/transactions')">
    <span class="icon">📋</span>
    <span class="label">Details</span>
  </button>

  <!-- Budget (预算) — replaces Charts tab; Analytics accessible via Profile -->
  <button class="nav-item"
          [class.active]="isActive('budget')"
          (click)="navigateTo('/budget')">
    <span class="icon">💰</span>
    <span class="label">Budget</span>
  </button>

  <!-- Add Button (Center FAB) -->
  <button class="nav-item add-button" (click)="openAddTransaction()">
    <span class="icon add-icon">+</span>
  </button>

  <!-- Invest (投资 = Portfolio + Net Worth) -->
  <button class="nav-item"
          [class.active]="isActive('invest')"
          (click)="navigateTo('/investments')">
    <span class="icon">💎</span>
    <span class="label">Invest</span>
  </button>

  <!-- Profile / More (我的) -->
  <button class="nav-item"
          [class.active]="isActive('profile')"
          (click)="navigateTo('/profile')">
    <span class="icon">👤</span>
    <span class="label">Profile</span>
  </button>

</nav>
