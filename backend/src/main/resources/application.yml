spring:
  application:
    name: PersonalMoneyManagement
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

anthropic:
  api:
    key: ${ANTHROPIC_API_KEY:}
