spring:
  application:
    name: PersonalMoneyManagement
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  # Local dev: H2 file-based database (data persists across restarts)
  datasource:
    url: jdbc:h2:file:./data/moneyflow;MODE=MySQL;NON_KEYWORDS=MONTH,VALUE,YEAR
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  # Disable Flyway for local dev (migration scripts use MySQL syntax)
  flyway:
    enabled: false

  # Disable Redis for local dev (not actually used by any service)
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: ${PORT:8080}

# JWT config for local dev
jwt:
  secret: local-dev-secret-key-at-least-32-characters-long
  expiration: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health,info

anthropic:
  api:
    key: ${ANTHROPIC_API_KEY:}

app:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:4200}
