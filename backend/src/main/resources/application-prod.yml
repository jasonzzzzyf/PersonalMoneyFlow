# Production overrides — activated via SPRING_PROFILES_ACTIVE=prod
spring:
  datasource:
    url: jdbc:h2:file:./data/moneyflow;MODE=MySQL;NON_KEYWORDS=MONTH,VALUE,YEAR
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false

  flyway:
    enabled: false

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

  h2:
    console:
      enabled: false

# JWT secret must be overridden via JWT_SECRET env var in production
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

# CORS: comma-separated list of allowed frontend origins
app:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:4200}
