services:
  - type: web
    name: personalmoneyflow-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JWT_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false

  - type: web
    name: personalmoneyflow-frontend
    env: static
    buildCommand: cd frontend && npm ci && npm run build -- --configuration production
    staticPublishPath: frontend/dist/personal-money-flow
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
